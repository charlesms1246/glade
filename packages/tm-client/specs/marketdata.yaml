  /v1/assets/prices/history:
    get:
      summary: Get price history for an asset
      operationId: getAssetPriceHistory
      tags: [Prices]
      description: |
        Returns historical price points for an asset over a configurable lookback
        window, sampled at a configurable resolution.

        The same series as `/v1/defi/market/prices/history`, mounted under the
        asset-oriented path. This mount stores no individual ticks, so candle
        endpoints and candle-input indicators are unavailable here.

        See the [Time Window & Resolution](/api/market-data/market-data-service-api#time-window--resolution)
        section for the format of `window` and `resolution`.
      security: []
      parameters:
        - name: asset_id
          in: query
          description: |
            Backend asset ID. Mutually exclusive with `symbol`: exactly one of
            the two is required, and naming both is a 400.
          required: false
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          description: Asset symbol (e.g. `SOL`, `BTC`).
          required: false
          deprecated: true
          schema:
            type: string
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).
          required: false
          schema:
            type: string
            default: "1h"
        - name: as_of
          in: query
          description: >-
            Ends the window at this instant instead of now, so a past period can be read. RFC3339, and not the zero time. A future instant bounds a window that is still filling. Absent reads live data.
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-01-02T03:04:05Z"
        - name: resolution
          in: query
          description: Gap between consecutive data points (e.g. `5s`, `1m`, `5m`, `1h`).
          required: false
          schema:
            type: string
            default: "5s"
        - name: asset_class
          in: query
          description: Asset class to resolve the asset in. Defaults to `spot`.
          required: false
          schema:
            type: string
            enum: [spot, perp]
            default: spot
      responses:
        "200":
          description: Price history data for the requested asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
