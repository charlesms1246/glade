          required: false
          deprecated: true
          schema:
            type: string
        - name: indicator
          in: query
          required: true
          description: Indicator kind to compute.
          schema:
            type: string
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).
          required: false
          schema:
            type: string
            default: "1h"
        - name: resolution
          in: query
          description: Gap between consecutive data points (e.g. `5s`, `1m`, `5m`, `1h`).
