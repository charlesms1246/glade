      summary: Get OHLC candles for an asset by chain and address
      operationId: getAssetCandles
      tags: [Assets]
      description: |
        Returns open/high/low/close buckets for any asset, taken from its most
        liquid pool. Candles come at the finest size at or above `resolution`
        that keeps the window within 1,000 candles, and daily past that, so the
        `resolution` in the response can be coarser than the one requested.

        See the [Time Window & Resolution](/api/market-data/market-data-service-api#time-window--resolution)
        section for the format of `window` and `resolution`.
