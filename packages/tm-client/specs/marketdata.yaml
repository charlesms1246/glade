          required: false
          schema:
            type: string
            default: "1h"
        - name: resolution
          in: query
          description: Smallest candle size wanted (e.g. `1m`, `1h`, `1d`).
          required: false
          schema:
            type: string
            default: "5s"
      responses:
        "200":
          description: Candle series for the asset
          content:
