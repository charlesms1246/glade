  /v1/defi/market/stream/bbo:
    get:
      summary: Stream BBO quotes
      operationId: streamBboQuotes
      tags: [Streams]
      description: >-
        Server-sent stream of best bid and offer quotes as each source publishes them, one `bbo` event per update and a comment frame between updates to keep the connection open.
      security: []
      responses:
        "200":
          description: The quote stream. Held open until the client disconnects.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
