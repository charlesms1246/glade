  /v1/cefi/market/prices/history:
    get:
      summary: Get CeFi instrument price history
      operationId: getCefiPriceHistory
      tags: [CeFi]
      description: |
        Returns historical bid/ask midpoint prices for a CeFi instrument
        over a configurable lookback window, sampled at a configurable
        resolution. Each price is `(bid + ask) / 2` from the latest EBBO
        snapshot in the bucket; buckets without both a bid and an ask are
        excluded.

        The `symbol` parameter is the venue-native instrument symbol (e.g.
        `BTC-USD`) — there is no registry translation today.

        See the [Time Window & Resolution](/api/market-data/market-data-service-api#time-window--resolution)
        section for the format of `window` and `resolution`.
      security: []
      parameters:
        - name: symbol
          in: query
          description: |
            Venue-native CeFi instrument symbol (e.g. `BTC-USD`). Required here:
            `asset_id` is rejected with a 400 on the CeFi routes, since CeFi
            instruments carry no price-source mapping to resolve one against.
          required: true
          schema:
            type: string
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).
          required: false
          schema:
            type: string
            default: "1h"
        - name: resolution
          in: query
          description: Gap between consecutive data points (e.g. `5s`, `1m`, `5m`, `1h`).
          required: false
          schema:
            type: string
            default: "5s"
      responses:
        "200":
          description: CeFi price history data for the requested symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No price data found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cefi/market/prices/indicators:
    get:
      operationId: getCefiPriceIndicators
      security: []
      tags: [CeFi]
      summary: Get a technical indicator series for a CeFi instrument
      description: |
        Same parameters, response shape and warm-up behaviour as
        [`/v1/defi/market/prices/indicators`](/api/market-data/get-price-indicators),
        computed over bid/ask midpoints rather than close prices.

        The `symbol` parameter is the venue-native instrument symbol (e.g.
        `BTC-USD`) — there is no registry translation today.

        `atr` and `trending_ratio` are not served here: this mount stores no
        individual ticks to build candles from, and a venue-native instrument
        carries no CoinGecko mapping to read reported volume from.
      parameters:
        - name: symbol
          in: query
          required: true
          description: |
            Venue-native CeFi instrument symbol (e.g. `BTC-USD`). Required here:
            `asset_id` is rejected with a 400 on the CeFi routes, since CeFi
            instruments carry no price-source mapping to resolve one against.
          schema:
            type: string
        - name: indicator
          in: query
          required: true
          schema:
            type: string
            enum: [sma, ema, rsi, macd, bollinger, surging_1h, surging_4h, surging_24h]
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).
          schema:
            type: string
            default: "1h"
        - name: resolution
          in: query
          description: Candle size the period counts in (e.g. `5s`, `1m`, `1h`).
          schema:
            type: string
            default: "5s"
        - name: period
          in: query
          description: |
            Lookback in candles. Required for sma, ema and rsi; defaults to 20
            for bollinger and is not used by macd. Rejected for the momentum
            measures, which cover a fixed span.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - name: fast_period
          in: query
          description: MACD fast EMA length. Defaults to 12.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - name: slow_period
          in: query
          description: MACD slow EMA length. Defaults to 26.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - name: signal_period
          in: query
          description: MACD signal EMA length. Defaults to 9.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - name: std_dev
          in: query
          description: Bollinger band width in standard deviations. Defaults to 2.
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Indicator lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorHistoryResponse"
        '400':
          description: Unknown indicator, or a parameter out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Not enough price history to compute the indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cefi/market/prices/range:
    get:
      summary: Get CeFi min/max price over a window
      operationId: getCefiPriceRange
      tags: [CeFi]
      description: |
        Returns the minimum and maximum bid/ask midpoint price observed for
        a CeFi instrument within a configurable lookback window, along with
        the timestamps at which each extreme occurred.

        See the [Time Window & Resolution](/api/market-data/market-data-service-api#time-window--resolution)
        section for the format of `window`.
      security: []
      parameters:
        - name: symbol
          in: query
          description: |
            Venue-native CeFi instrument symbol (e.g. `BTC-USD`). Required here:
            `asset_id` is rejected with a 400 on the CeFi routes, since CeFi
            instruments carry no price-source mapping to resolve one against.
          required: true
          schema:
            type: string
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `4h`, `1d`, `7d`, `1M`).
          required: false
          schema:
            type: string
            default: "1h"
      responses:
        "200":
          description: Price range data for the requested CeFi symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRangeResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No price data found for the symbol within the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/marketdata/venue-history:
    get:
      summary: Get one venue's price or funding series for an asset
      operationId: getVenueHistory
      tags: [Venue History]
      description: |
        Returns a single venue's series for an asset, one point per `interval`
        bucket holding the last value seen in it. Buckets with no data are
        omitted. Points are oldest first. Internal: Envoy does not route this
        path, so only services inside the network reach it.

        A request is capped at 50,000 buckets: `window` divided by `interval`
        above that is a 400 (`30d` at `1m` is 43,200 and allowed; `7d` at `5s`
        is 120,960 and rejected).

        Sources per `venue`, all matched on `asset_id`:

        | venue | metric | source |
        |---|---|---|
        | `robinhood`, `base` | `price` | CoinGecko onchain price on that chain; 0x price on that chain when CoinGecko has no row in the window |
        | `solana` | `price` | Jupiter price |
        | `hyperliquid` | `price` | Hyperliquid spot mid |
        | `hyperliquid-perp` | `price` | Hyperliquid perp mid |
        | `hyperliquid-perp` | `funding` | Hyperliquid hourly funding rate as a decimal fraction |
        | `cefi` | `price` | CeFi EBBO midpoint, (bid + ask) / 2 |
      security: []
      parameters:
        - name: asset_id
          in: query
          description: Backend asset ID.
          required: true
          schema:
            type: string
            format: uuid
        - name: venue
          in: query
          description: Venue whose series to read.
          required: true
          schema:
            type: string
            enum: [robinhood, base, solana, hyperliquid, hyperliquid-perp, cefi]
        - name: metric
          in: query
          description: Series to read. `funding` is served only for `hyperliquid-perp`.
          required: false
          schema:
            type: string
            enum: [price, funding]
            default: price
        - name: window
          in: query
          description: Lookback period (e.g. `1h`, `1d`, `7d`), at most `30d` and at most 50,000 intervals.
          required: true
          schema:
            type: string
        - name: interval
          in: query
          description: Bucket size.
          required: true
          schema:
            type: string
            enum: ["5s", "30s", "1m", "5m", "1h"]
      responses:
        "200":
          description: The venue's series for the asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueHistoryResponse"
        "400":
          description: Bad request - invalid parameters, or more than 50,000 buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The venue has no series for the asset in the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    FeedLimit:
      name: limit
      in: query
      description: Assets to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    FeedSort:
      name: sort
      in: query
      description: Rank ascending instead of descending.
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AssetAddress:
      name: address
      in: query
      description: Asset contract address (EVM) or mint address (Solana).
      required: true
      schema:
        type: string
        example: "pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn"
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    IndicatorPoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
        value:
          type: string
          description: Indicator value at this timestamp
    IndicatorHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
        window:
          type: string
        resolution:
          type: string
        indicator:
          type: string
        lines:
          type: object
          description: Indicator lines keyed by line name
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/IndicatorPoint"
    TrendingAsset:
      type: object
      properties:
        symbol:
          type: string
        address:
          type: string
          description: On-chain token address
        chain:
          type: string
        market_cap:
          type: string
        trending_ratio:
          type: string
          description: Recent volume over the historical baseline
        recent_volume:
          type: string
        historical_volume:
          type: string
    TrendingResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/TrendingAsset"
    SurgingAsset:
      type: object
      properties:
        symbol:
          type: string
        address:
          type: string
          description: On-chain token address
        chain:
          type: string
        price_change_pct_1h:
          type: string
        price_change_pct_4h:
          type: string
        price_change_pct_24h:
          type: string
        price_1h_ago:
          type: string
        price_4h_ago:
          type: string
        price_24h_ago:
          type: string
        current_price:
          type: string
    SurgingResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/SurgingAsset"
    Error:
      type: object
      description: Shared API error envelope
      required:
        - type
        - message
        - request_id
      properties:
        type:
          type: string
          description: Closed error category fixing the HTTP status
          enum:
            - invalid_argument
            - unauthenticated
            - permission_denied
            - not_found
            - method_not_allowed
            - conflict
            - failed_precondition
            - resource_exhausted
            - unavailable
            - internal
        code:
          type: string
          description: >-
            Specific error condition from the fleet code registry. Extensible: clients MUST tolerate any value and fall back to type-based handling. No operation here emits one today.
        message:
          type: string
          description: Human-readable error message
        metadata:
          type: object
          description: >-
            Machine-readable context scoped to `code`; values are always strings. Which keys appear is determined by `code`.
          additionalProperties:
            type: string
        field_violations:
          type: array
          description: >-
            Per-field rejections, present on `invalid_argument` when the request failed field validation.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Dotted path to the offending field, as the client sent it
              message:
                type: string
                description: Human-readable reason the field was rejected
        request_id:
          type: string
          description: Per-request correlation ID, empty when unavailable
    MarketCapResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID
        symbol:
          type: string
          description: The asset symbol
        market_cap:
          type: string
          description: Market capitalization in USD (as string to preserve precision)
    MarketCapListResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/MarketCapResponse"
          description: List of assets with market cap, sorted by market cap descending
    PriceResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID, present when the request named one
        symbol:
          type: string
          description: The asset symbol
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
          description: List of price candles for different time intervals
    Candle:
      type: object
      properties:
        interval:
          type: string
          description: Time interval for the candle (e.g., 1h, 4h, 24h)
        openPrice:
          type: string
          description: Opening price for the interval
        closePrice:
          type: string
          description: Closing price for the interval
        highPrice:
          type: string
          description: Highest price during the interval
        lowPrice:
          type: string
          description: Lowest price during the interval
    PricePointResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
          description: The asset symbol
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp of the actual data point returned
        price:
          type: string
          description: Price at the returned timestamp
    PriceRangeResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
          description: The asset symbol
        window:
          type: string
          description: The time window used for the query
        min_price:
          type: string
          description: Minimum price within the window
        max_price:
          type: string
          description: Maximum price within the window
        min_timestamp:
          type: string
          description: ISO 8601 timestamp when the minimum price occurred
        max_timestamp:
          type: string
          description: ISO 8601 timestamp when the maximum price occurred
    PerpMarketHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID of the perp
        symbol:
          type: string
          description: The perp symbol
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        points:
          type: array
          items:
            $ref: "#/components/schemas/PerpMarketPoint"
          description: Funding rate and open interest buckets, oldest first
    PerpMarketPoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the bucket
        funding_rate:
          type: string
          description: Hourly funding rate as a decimal fraction (0.0000125 is 0.00125% per hour)
        open_interest:
          type: string
          description: Open interest as a coin count of the base asset, not a USD notional
    VolumeHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID
        symbol:
          type: string
          description: The asset symbol
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        points:
          type: array
          items:
            $ref: "#/components/schemas/VolumePoint"
          description: Reported 24h volume buckets, oldest first
    VolumePoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the bucket
        volume:
          type: string
          description: Reported rolling 24h volume in USD at this timestamp
    ScanCandidate:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID
        symbol:
          type: string
          description: The asset symbol
        value:
          type: string
          description: The figure the source ranks on, signed for a price change
    ScanBucket:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the bucket
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ScanCandidate"
          description: The bucket's top assets, best first
    ScanHistoryResponse:
      type: object
      properties:
        source:
          type: string
          description: The ranking that was taken
        sort:
          type: string
          description: Which end of the ranking each bucket kept
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        per_bucket:
          type: integer
          description: The most assets any bucket carries
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ScanBucket"
          description: One ranking per bucket, oldest first
    VenueHistoryResponse:
      type: object
      required: [asset_id, venue, metric, interval, points]
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID
        venue:
          type: string
          description: The venue the series was read from
        metric:
          type: string
          description: The series read, `price` or `funding`
        interval:
          type: string
          description: The bucket size
        points:
          type: array
          items:
            $ref: "#/components/schemas/VenuePoint"
          description: One point per bucket with data, oldest first
    VenuePoint:
      type: object
      required: [t, v]
      properties:
        t:
          type: string
          format: date-time
          description: RFC 3339 start of the bucket
        v:
          type: string
          description: Last value in the bucket as a decimal string
    MarketCapHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID
        symbol:
          type: string
          description: The asset symbol
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        points:
          type: array
          items:
            $ref: "#/components/schemas/MarketCapPoint"
          description: Reported market-cap buckets, oldest first
    MarketCapPoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the bucket
        market_cap:
          type: string
          description: Reported market capitalisation in USD at this timestamp
    PriceHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
          description: The asset symbol
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
          description: List of price points
    Point:
      type: object
      properties:
        t:
          type: string
          description: ISO 8601 timestamp for the price point
        price:
          type: string
          description: Price at this timestamp
    CandleHistoryResponse:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
          description: The asset symbol
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The candle size used for the query
        candles:
          type: array
          items:
            $ref: "#/components/schemas/CandleBucket"
          description: List of OHLC buckets, oldest first
    AssetChain:
      type: string
      enum: [solana, base, arbitrum, robinhood]
      description: A chain asset lookups cover
    Asset:
      type: object
      description: An asset's on-chain market on one chain, priced from its DEX pools.
      required:
        - chain
        - address
        - name
        - symbol
        - decimals
        - price_usd
        - fdv_usd
        - market_cap_usd
        - total_reserve_in_usd
        - volume_usd_24h
      properties:
        chain:
          $ref: "#/components/schemas/AssetChain"
        address:
          type: string
          description: Asset address, lowercased for EVM chains
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        image_url:
          type: string
          description: Asset icon. Absent when the asset has none.
        price_usd:
          type: [string, "null"]
          description: USD price, null when the asset cannot be priced
        fdv_usd:
          type: [string, "null"]
          description: Fully diluted valuation in USD, null when it cannot be computed
        market_cap_usd:
          type: [string, "null"]
          description: Market capitalization in USD, null when it cannot be computed or the asset is unverified
        total_reserve_in_usd:
          type: string
          description: USD liquidity of the asset across its pools
        volume_usd_24h:
          type: string
          description: USD volume traded over the last 24 hours
    AssetListResponse:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
          description: The asset on each chain it was found on
    AssetCandlesResponse:
      type: object
      required: [chain, address, window, resolution, candles]
      properties:
        chain:
          $ref: "#/components/schemas/AssetChain"
        address:
          type: string
          description: Asset address, lowercased for EVM chains
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The candle size served, which can be coarser than the one requested
        candles:
          type: array
          items:
            $ref: "#/components/schemas/CandleBucket"
          description: List of OHLC buckets, oldest first
    CandleBucket:
      type: object
      properties:
        t:
          type: string
          description: ISO 8601 timestamp of the bucket start
        open:
          type: string
          description: First price in the bucket
        high:
          type: string
          description: Highest price in the bucket
        low:
          type: string
          description: Lowest price in the bucket
        close:
          type: string
          description: Last price in the bucket
        volume:
          type: string
          description: Base-asset quantity traded in the bucket. Omitted for a price source that reports no trade sizes.
    BatchPriceHistoryResponse:
      type: object
      properties:
        window:
          type: string
          description: The time window used for the query
        resolution:
          type: string
          description: The time resolution used for the query
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchPriceHistoryResult"
          description: Per-symbol results
    BatchPriceHistoryResult:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
          description: Backend asset ID. Absent on the CeFi routes.
        symbol:
          type: string
          description: The asset symbol
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
          description: Price points (omitted if error)
        error:
          type: string
          description: Error message if the symbol could not be resolved (omitted on success)
