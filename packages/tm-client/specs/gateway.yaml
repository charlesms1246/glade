openapi: 3.0.3
info:
  title: Trading REST
  description: |
    Gateway API for the True Markets trading platform — unified order orchestration, quotes, transfers, and balance management across CeFi and DeFi venues. Recommended for most integrations.

    ## Base URLs

    | Environment | Base URL |
    |---|---|
    | Production | `https://api.truemarkets.co/v1/gateway` |
    | UAT (sandbox) | `https://api.uat.truemarkets.co/v1/gateway` |

    > The legacy `/v1/conductor` base path continues to work for existing integrations but is deprecated — new integrations should use `/v1/gateway`.

    > UAT is the testing environment. It may require VPN/allowlist access for some integrations — contact [support@truemarkets.co](mailto:support@truemarkets.co) if requests time out from a public network.

    ## Authentication

    All endpoints require a JWT access token in the `Authorization: Bearer <token>` header.

    ### Getting credentials

    There are two ways in, and each uses its own keys.

    **Gateway (an organization trading for its users).** Create an organization and an API key in the dashboard, then mint a token with `POST /v1/auth/api-key/token`. An organization token lasts one hour and has no refresh token, so mint a new one before it expires. Sign each user's payloads with their signer key, not the organization API key.

    **Trading API (your own account).**

    1. **Create an account** at [https://www.truemarkets.co](https://www.truemarkets.co) (passkey, email, magic link, or Sign in with Apple).
    2. **Register an API key** in your account's *API Keys* settings page. Generate an EC P-256 key pair locally and submit only the public key — the private key never leaves your machine. You'll receive a `key_id` (UUID). The same key signs you in and signs your payloads.
    3. **Mint JWTs** by calling `POST /v1/auth/api-key/token` with `key_id`, a current `timestamp` (Unix seconds, within ±30s of server UTC time), and `signature` — an ES256 (ECDSA P-256 + SHA-256) signature of the message `{key_id}.{timestamp}`, base64url-encoded. The response returns `access_token` and `refresh_token`.
    4. **Call the Gateway** with `Authorization: Bearer <access_token>`.
    5. **Refresh** expired access tokens via `POST /v1/auth/token/refresh` with the `refresh_token` — no re-signing required.

    ### Acting for a user

    An organization trades for the users it created. Mint a token from an organization API key,
    then add `TM-On-Behalf-Of: <user_id>` to any user route: the request reads and writes that
    user's account. The header is declared on every route that accepts it, and organization-scoped
    routes reject it.

    ### Quick start

    ```bash
    # Mint a JWT
    curl -X POST https://api.truemarkets.co/v1/auth/api-key/token \
      -H "Content-Type: application/json" \
      -d '{"key_id":"<UUID>","timestamp":<UNIX_SECONDS>,"signature":"<BASE64URL_ES256_SIG>"}'

    # Compute a quote
    curl -X POST https://api.truemarkets.co/v1/gateway/quotes \
      -H "Authorization: Bearer <ACCESS_TOKEN>" \
      -H "Content-Type: application/json" \
      -d '{"base_asset":"BTC","quote_asset":"USD","qty":"1000","qty_unit":"quote","side":"buy"}'
    ```

    > Need to trade on a CeFi venue directly? CeFi direct FIX/REST/WS is institutional only — see the [CeFi Direct REST API](/apis/cefi-direct/rest/v1) reference. Retail traders reach CeFi via this Gateway, which proxies the upstream calls for you.

    ## Order lifecycle

    Orders move through a small set of statuses. The path depends on whether the venue and order type require client-side signing.

    1. **Create** — `POST /orders` with your trade params. The response returns an `order_id` and a `status`. The exception is a DeFi order the account cannot fund (no on-chain balance and no CeFi balance to bridge): the response carries the `quote` with an `Insufficient balance` entry in `quote.issues`, an empty `order_id`, and no `payloads`. The quote is informational so the client can still show the expected output, but no order is created and it cannot be executed.
    2. **Sign and execute** — for DeFi orders and CeFi buy orders that need a funding bridge, the create response returns `status: initialized` along with an array of unsigned `payloads`. Sign each payload locally with the key that controls the wallet (a Gateway user's signer key, or your own API key) and post the signatures to `POST /orders/{id}/execute`. A CeFi buy then moves to `pending`; a DeFi order settles synchronously to `complete` (immediate fill) or `active` (a limit order resting on-chain).
    3. **Submitted directly** — for CeFi sell orders and sufficiently funded CeFi buy orders, the create response already returns `status: pending` with no `payloads`. The execute step is skipped. In a paper-trading environment DeFi orders also take this path: they settle against the virtual ledger during create and return a terminal `status` (`complete`) with no `payloads`, so clients must treat an empty `payloads` array as "already submitted" rather than waiting to sign.
    4. **Settle** — the order transitions out of `pending` to one of:
        - `complete` — fully filled.
        - `active` — limit order resting in the order book (can later move to `complete` or `canceled`).
        - `canceled` — canceled by the user or rejected by exchange/market conditions. A CeFi cancel first passes through `cancel_pending` until the exchange confirms.
        - `failed` — rejected by the exchange or DeFi execution reverted.

    Poll `GET /orders/{id}/status` (or list orders) to track progression. The `payloads` field in the create response is the signal: if it's non-empty, you need to sign and call execute. If it's empty or absent, the order is already submitted, unless `order_id` is empty and `quote.issues` reports an insufficient-balance problem, which means no order was created.

    ## Support
    - 📧 [support@truemarkets.co](mailto:support@truemarkets.co)
  version: "1.56.0"
  contact:
    name: True Markets support
    email: support@truemarkets.co
servers:
  - url: https://api.truemarkets.co/v1/gateway
    description: Production
  - url: https://api.uat.truemarkets.co/v1/gateway
    description: UAT (sandbox)
tags:
  - name: Quotes
    description: Request real-time market quotes for trading pairs without creating an order.
  - name: Orders
    description: Create, execute, cancel, and monitor orders across CeFi and DeFi.
  - name: Transfers
    description: Create, execute, and monitor transfers across CeFi and DeFi.
  - name: Ramps
    description: Sell stablecoin balances for fiat through Coinbase or PayPal, funded from CeFi when needed.
  - name: Custody
    description: >-
      Set aside part of the caller's DeFi wallet balance for CeFi trading, and release it again. Tokens stay in the caller's wallet. Nothing is sent on chain or to a bank; for that, see Transfers and Ramps.
  - name: Paper Trading
    description: >-
      Add and remove test funds in a paper-trading environment. These endpoints exist only in non-production paper-trading environments such as UAT; production answers `404`.
  - name: Transactions
    description: One unified feed of the caller's orders, transfers, ramps, and received transfers.
  - name: Assets
    description: Browse the unified catalog of tradeable assets across DeFi and CeFi venues.
  - name: Balances
    description: Query account balances for the authenticated user.
  - name: Positions
    description: Query a user's open Hyperliquid perpetual positions.
paths:
  # ==================== QUOTE ENDPOINTS ====================
  /quotes:
    post:
      operationId: computeQuote
      summary: Compute market quote
      description: >-
        Non-binding price preview for a market order. `base_asset` and `quote_asset` quote a CeFi pair. `asset_id` quotes any listing for the caller, and needs a bearer token.



        **Rate limit:** counts against the Quotes limit, 120 a minute (user token, per user); 1,200 a minute (organization api key, per organization); 120 a minute (no token, per ip address). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Quotes
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Quote computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-rate-limit: quote
  # ==================== ORDER ENDPOINTS ====================
  /orders:
    post:
      operationId: createOrder
      summary: Create new order
      description: |-
        Creates a new order. For DeFi orders, returns unsigned payloads for client signing.


        A DeFi order can spend funds committed to CeFi trading; they are freed before the
        payloads are returned. If they can't be, the request fails with `422 funds_allocated`
        (held by open CeFi orders) or `409 release_settling` (retry shortly).


        **Rate limit:** counts against the Orders limit, 10 a second and 120 a minute (user token, per user); 100 a second and 1,200 a minute (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-rate-limit: order
    get:
      operationId: listOrders
      summary: List user orders
      description: >
        Returns a paginated list of the authenticated user's orders with execution data. All statuses are returned by default; narrow the results with the `status` query parameter.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: limit
          in: query
          description: Maximum number of orders to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from the previous page's `next_cursor`
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Comma-separated list of order statuses to filter by
          required: false
          schema:
            type: string
            example: "pending,canceled"
        - name: venue
          in: query
          description: >
            Comma-separated list of trading venues to filter by (`defi`, `cefi`). Defaults to all venues (`cefi,defi`) when omitted.
          required: false
          schema:
            type: string
            default: "cefi,defi"
            example: "cefi,defi"
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrdersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/execute:
    post:
      operationId: executeOrder
      summary: Execute pending order
      description: Executes a pending order using client-provided signatures for the unsigned payloads


        **Rate limit:** counts against the Orders limit, 10 a second and 120 a minute (user token, per user); 100 a second and 1,200 a minute (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOrderRequest"
      responses:
        "200":
          description: Order execution initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-rate-limit: order
  /orders/all/cancel:
    post:
      operationId: cancelAllOrders
      summary: Cancel all open orders on a venue
      description: |
        Cancels all of your open orders on the given venue and returns how many
        were canceled. Cancellation is asynchronous — confirm final per-order
        state via `GET /orders`. Only `cefi` is supported today; `defi` returns
        `501 Not Implemented`.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAllOrdersRequest"
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAllOrdersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/cancel:
    post:
      operationId: prepareCancelOrder
      summary: Cancel a limit or TP/SL order (CeFi or DeFi)
      description: |
        Venue-polymorphic cancel. The `payloads` field is the signal:
        - **CeFi** orders are canceled immediately and return `202 Accepted` with no
          `payloads`. Poll `GET /orders/{id}/status` for the terminal state.
        - **DeFi** (Hyperliquid) resting orders return `200 OK` with unsigned
          `payloads`. Sign each locally and post the signatures to
          `POST /orders/{id}/cancel/execute`.

        Only cancellable orders (CeFi `pending`/`active` limit orders, DeFi
        `active` limit or TP/SL trigger orders) can be canceled. An order that
        is no longer open (`complete`, `canceled` or `failed`) returns `422`
        with code `order_not_open`; refetch it for its final status. Other
        orders return 400. An order with `strategy_managed` set is cancelled by
        its strategy, not here, and returns 422.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resting DeFi order; unsigned cancel payloads to sign and execute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResponse"
        "202":
          description: CeFi cancel accepted; poll order status for the terminal state
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /orders/{id}/cancel/execute:
    post:
      operationId: executeCancelOrder
      summary: Execute a resting DeFi order cancellation
      description: |
        Submits the client's signatures over the payloads returned by
        `POST /orders/{id}/cancel` to cancel a resting DeFi limit or TP/SL order.
        The order moves to `canceled` once the venue confirms, keeping any
        quantity that filled before the cancel in `executed_qty`/`executed_vwap`.
        An order that filled before the cancel landed moves to `complete`. An
        order that is no longer open, including one the venue reports closed
        before it can say how, returns `422` with code `order_not_open`.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOrderRequest"
      responses:
        "200":
          description: Cancellation submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /orders/modify/{id}/prepare:
    post:
      operationId: prepareModifyTriggers
      summary: Prepare moving resting DeFi TP/SL orders to new trigger prices
      description: |-
        Prepares one Hyperliquid batch modify, under the client-chosen batch `id`,
        moving each listed order to its new trigger price, and returns the single
        unsigned payload the client signs and posts to
        `POST /orders/modify/{id}/execute` with the same `id`. Reusing an `id`
        that is already prepared returns 409. Every order must be the caller's `active` DeFi TP/SL trigger
        order on the same account; each keeps the slippage bound it was placed
        with, scaled to its new trigger. A trigger price on the wrong side of the
        current price returns 400; an order that is no longer open returns `422`
        with code `order_not_open`.


        **Rate limit:** counts against the Orders limit, 10 a second and 120 a minute (user token, per user); 100 a second and 1,200 a minute (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Client-chosen batch id, reused for `POST /orders/modify/{id}/execute`
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyTriggersRequest"
      responses:
        "200":
          description: Unsigned batch payload to sign and execute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifyTriggersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
      x-rate-limit: order
  /orders/modify/{id}/execute:
    post:
      operationId: executeModifyTriggers
      summary: Execute a prepared TP/SL modify
      description: |-
        Submits the client's signature over the payload `POST /orders/modify/{id}/prepare`
        returned. Each order reports the trigger price it now rests at, or the
        venue's `error` when it refused that order, for example a trigger that
        already fired; refused orders keep their previous trigger. A prepared
        modify is single-use: an unknown or spent `id` returns 404.


        **Rate limit:** counts against the Orders limit, 10 a second and 120 a minute (user token, per user); 100 a second and 1,200 a minute (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: The batch id prepared with `POST /orders/modify/{id}/prepare`
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOrderRequest"
      responses:
        "200":
          description: Each order's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteModifyTriggersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-rate-limit: order
  /orders/{id}:
    get:
      operationId: getOrder
      tags:
        - Orders
      summary: Get a single order
      description: Returns full execution details for an order owned by the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: modifyOrder
      tags:
        - Orders
      summary: Modify an active limit order
      description: |-
        Changes the price and/or quantity of an active CeFi limit order. The change
        is asynchronous: the order's stored price and quantity update once the
        exchange confirms the modification. Only active limit orders are modifiable.
        On a DeFi-settled market, a modification that holds more than the CeFi
        balance covers first allocates the difference from the user's DeFi wallet
        and is queued until it lands; if the queued modification then fails, the
        user is notified and the order keeps its previous price and quantity.


        **Rate limit:** counts against the Orders limit, 10 a second and 120 a minute (user token, per user); 100 a second and 1,200 a minute (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyOrderRequest"
      responses:
        "202":
          description: Modification request accepted
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-rate-limit: order
  /orders/{id}/status:
    get:
      operationId: getOrderStatus
      summary: Get order status
      description: Returns the current status of an order
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OnBehalfOf"
        - name: id
          in: path
          description: Order ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrderStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /transfers:
    post:
      operationId: createTransfer
      summary: Create new transfer
      description: >-
        Creates a new on-chain transfer. Returns unsigned payloads for the client to sign before executing.


        For CeFi transfers, `network` is required — retrieve the supported values from `GET /assets` (see the `network` field below). Omit it for DeFi transfers, which derive the network from the asset's chain. A CeFi asset held in the wallet is sent from the wallet.


        A transfer can spend funds committed to CeFi trading; they are freed before the payloads are returned. If they can't be, the request fails with `422 funds_allocated` (held by open CeFi orders) or `409 release_settling` (retry shortly).


        **Rate limit:** counts against the Money movement limit, 20 a minute and 300 a day (user token, per user); 200 a minute and 3,000 a day (organization api key, per organization). See [Rate limits](/developer-resources/rate-limits).
      tags:
        - Transfers
      security:
        - bearerAuth: []
